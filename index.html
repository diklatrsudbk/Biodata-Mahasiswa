<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Peserta Didik 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Plus Jakarta Sans',sans-serif;
            background:#f4f6f9;
        }

        .menu-card{
            transition:all .25s ease;
        }

        .menu-card:hover{
            transform:translateY(-6px);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <div class="max-w-5xl w-full">

        <!-- HEADER -->
        <div class="text-center mb-14">

            <img
                src="assets/img/rsudbk.png"
                class="h-28 mx-auto mb-6"
                alt="Logo"
            >

            <h1 class="text-4xl font-extrabold text-slate-800">
                Sistem Data Peserta Didik
            </h1>

            <p class="text-slate-500 mt-3">
                Management Biodata Peserta Didik 2026
            </p>

            <div class="w-24 h-1 bg-[#714B67] mx-auto rounded-full mt-5"></div>

        </div>

        <!-- MENU -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- INPUT -->
            <a
                href="input_biodata.html"
                class="menu-card bg-white rounded-3xl shadow-lg p-10 border border-slate-100 hover:border-[#714B67]"
            >

                <div class="text-5xl mb-5">
                    📝
                </div>

                <h2 class="text-2xl font-bold text-[#714B67] mb-3">
                    Input Data Baru
                </h2>

                <p class="text-slate-500 leading-relaxed">
                    Tambahkan biodata peserta didik baru ke sistem database.
                </p>

            </a>

            <!-- EDIT -->
            <a
                href="edit.html"
                class="menu-card bg-white rounded-3xl shadow-lg p-10 border border-slate-100 hover:border-amber-500"
            >

                <div class="text-5xl mb-5">
                    🗂️
                </div>

                <h2 class="text-2xl font-bold text-amber-600 mb-3">
                    Edit / Delete Data
                </h2>

                <p class="text-slate-500 leading-relaxed">
                    Kelola data peserta, edit biodata, dan hapus data.
                </p>

            </a>

        </div>

    </div>

</body>
</html>
