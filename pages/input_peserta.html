<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Data Peserta Didik 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        [x-cloak] { display: none !important; }
        /* Optimalisasi kenyamanan input di HP */
        input, select, textarea { font-size: 16px !important; } 
    </style>
</head>
<body class="bg-[#f5f7fb] text-slate-800 py-6 px-3 md:py-10 md:px-4 antialiased" x-data="app()" x-init="init()">

    <!-- Datalist untuk Autocomplete -->
    <datalist id="list-kota">
        <template x-for="item in options.kota"><option :value="item"></option></template>
    </datalist>
    <datalist id="list-univ">
        <template x-for="item in options.universitas"><option :value="item"></option></template>
    </datalist>
    <datalist id="list-jurusan">
        <template x-for="item in options.jurusan"><option :value="item"></option></template>
    </datalist>

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-6 md:mb-10">
            <img src="../assets/img/rsudbk.png" alt="Logo RSUD BK" class="h-16 md:h-24 w-auto mx-auto mb-3 object-contain"> 
            <!-- Perubahan 1: Mengubah judul utama secara dinamis tergantung isEdit -->
            <h1 class="text-xl md:text-3xl font-extrabold text-[#212529]" 
                x-text="isEdit ? '✏️ Edit Data Peserta Didik' : '📝 Data Peserta Didik 2026'"></h1>
            <div class="h-1 w-16 bg-[#714B67] mx-auto mt-2 rounded-full"></div>
        </div>

        <!-- Tampilan Jika Pendaftaran Ditutup -->
        <template x-if="typeof registrationClosed !== 'undefined' ? registrationClosed : false">
            <div class="min-h-[40vh] flex flex-col items-center justify-center bg-white p-6 rounded-2xl border border-slate-200 text-center shadow-sm">
                <div class="text-5xl mb-3">🔒</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">Pendaftaran Ditutup</h2>
                <p class="text-slate-600 text-sm max-w-md mb-6">
                    Mohon maaf, saat ini tidak ada gelombang pendaftaran yang sedang aktif atau waktu pendaftaran telah berakhir.
                </p>
                <button type="button" onclick="window.location.href='../index.html'" class="w-full sm:w-auto bg-[#714B67] text-white px-6 py-3 rounded-xl text-sm font-bold shadow-md hover:opacity-90 transition">
                    ← Kembali ke Menu Utama
                </button>
            </div>
        </template>

        <!-- Tampilan Jika Pendaftaran Terbuka -->
        <template x-if="typeof registrationClosed !== 'undefined' ? !registrationClosed : true">
            <div>
                <div class="flex flex-row items-center justify-between mb-5 gap-4">
                    <!-- Perubahan 2: Menyesuaikan tujuan tombol kembali jika diakses oleh admin dari file peserta.html -->
                    <button type="button" 
                            @click="window.location.href = isEdit ? 'peserta.html' : '../index.html'" 
                            class="flex items-center text-[#714B67] font-bold hover:underline text-xs md:text-sm">
                        ← Kembali
                    </button>
                    <div>
                        <!-- Perubahan 3: Jika dalam mode edit, ubah teks label target agar admin tahu data ini disimpan di gelombang mana -->
                        <span class="bg-[#714B67]/10 text-[#714B67] px-3 py-1.5 rounded-lg text-[11px] font-bold" 
                              x-text="isEdit ? 'Sheet: ' + config.targetSheet : 'Target: ' + config.targetSheet"></span>
                    </div>
                </div>

                <form @submit.prevent="handleSubmit" :class="loading ? 'opacity-50 pointer-events-none' : ''" class="space-y-5">
                    
                    <div class="bg-white p-4 md:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
    <h2 class="text-[#714B67] font-bold uppercase tracking-wider text-[11px] border-b pb-2">I. Verifikasi Nomor Induk</h2>
    
    <div>
        <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">NIM / NISN</label>
        <input 
            type="text" 
            x-model="formData.nim" 
            @blur="!isEdit && checkNimOtomatis()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" 
            :class="isEdit ? 'bg-slate-100 cursor-not-allowed opacity-75' : ''" 
            :disabled="isEdit" 
            placeholder="Masukkan Nomor Induk Siswa/Mahasiswa Anda" 
            required>
        
        <template x-if="isEdit">
            <div class="mt-2 flex items-center justify-between bg-amber-50 p-2 rounded-lg border border-amber-200">
                <span class="text-[11px] text-amber-700 font-semibold">✨ Mode: Mengubah Data Lama Anda</span>
                <!-- Perubahan 4: Arahkan fungsi reset agar membersihkan parameter URL juga jika diinginkan -->
                <button type="button" @click="resetFormData" class="text-[11px] text-red-500 hover:underline font-bold">Ganti/Reset NIM</button>
            </div>
        </template>
    </div>
    
    <input type="hidden" x-model="formData.catatanRiwayat">
</div>

                    <div class="bg-white p-4 md:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <h2 class="text-[#714B67] font-bold uppercase tracking-wider text-[11px] border-b pb-2">II. Data Institusi & Kegiatan</h2>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Bagian</label>
                                <select x-model="formData.bagian" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                    <option value="" disabled selected hidden>-- Pilih Bagian --</option>
                                    <option value="Pelayanan Medik">Pelayanan Medik</option>
                                    <option value="Penunjang Medik">Penunjang Medik</option>
                                    <option value="Umum">Umum</option>
                                </select>
                                
                                <div class="mt-2 p-3 bg-slate-50 border-l-4 border-[#714B67] rounded-r-xl">
                                    <p class="text-[11px] text-slate-600 leading-relaxed">
                                        <strong>Panduan Memilih Bagian:</strong><br>
                                        • <span class="font-semibold text-[#714B67]">Pelayanan Medik:</span> Kedokteran, Kebidanan, Keperawatan, Keperawatan Anestesiologi.<br>
                                        • <span class="font-semibold text-[#714B67]">Penunjang Medik:</span> Farmasi, Gizi, Radiologi, Rekam Medis, Analis, dll.<br>
                                        • <span class="font-semibold text-[#714B67]">Umum:</span> Administrasi, Manajemen, Promkes, IT, Keuangan, Teknik.
                                    </p>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Jenis Praktik</label>
                                <select x-model="formData.jenis" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                    <option value="" disabled selected hidden>-- Pilih Jenis --</option>
                                    <option value="PKL">PKL</option>
                                    <option value="PBL">PBL</option>
                                    <option value="Pembelajaran Luar Kelas">Pembelajaran Luar Kelas</option>
                                    <option value="Magang">Magang</option>
                                    <option value="Resident">Resident</option>
                                    <option value="Hospital Visit">Hospital Visit</option>
                                    <option value="LIC">LIC</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Jenjang Pendidikan</label>
                                <select x-model="formData.jenjangPendidikan" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                    <option value="" disabled selected hidden>-- Pilih Jenjang --</option>
                                    <option value="SMK">SMK</option>
                                    <option value="D3">D3</option>
                                    <option value="D4">D4</option>
                                    <option value="S1">S1</option>
                                    <option value="S2 Pasca Sarjana">S2 Pasca Sarjana</option>
                                    <option value="Profesi">Profesi</option>
                                    <option value="Spesialis 1">Spesialis 1</option>
                                    <option value="Spesialis 2">Spesialis 2</option>
                                    <option value="Fellowship">Fellowship</option>
                                </select>
                            </div>
                            
                            <div x-data="searchableSelect(options.universitas, () => formData.namaInstitusi, value => formData.namaInstitusi = value)" class="relative">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nama Institusi / Universitas</label>
                                <input type="text" x-model="search" @focus="open = true" @input="filterOptions()" @click.away="open = false" autocomplete="off" placeholder="Cari atau ketik institusi..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                <div x-show="open" x-transition x-cloak class="absolute z-50 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto">
                                    <template x-for="item in filtered" :key="item">
                                        <div @click="select(item)" class="px-4 py-3 hover:bg-[#714B67] hover:text-white cursor-pointer text-sm transition" x-text="item"></div>
                                    </template>
                                </div>
                            </div>

                            <div x-data="searchableSelect(options.jurusan, () => formData.jurusan, value => formData.jurusan = value)" class="relative">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Jurusan</label>
                                <input type="text" x-model="search" @focus="open = true" @input="filterOptions()" @click.away="open = false" autocomplete="off" placeholder="Cari atau ketik jurusan..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                <div x-show="open" x-transition x-cloak class="absolute z-50 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto">
                                    <template x-for="item in filtered" :key="item">
                                        <div @click="select(item)" class="px-4 py-3 hover:bg-[#714B67] hover:text-white cursor-pointer text-sm transition" x-text="item"></div>
                                    </template>
                                </div>
                            </div>

                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Kota Institusi</label>
                                <input type="text" x-model="formData.kotaInstitusi" list="list-kota" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" placeholder="Ketik nama kota..." required>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tanggal Mulai</label>
                                <input type="date" x-model="formData.startDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tanggal Selesai</label>
                                <input type="date" x-model="formData.endDate" @change="validateDates" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 md:p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="text-[#714B67] font-bold uppercase tracking-wider text-[11px] mb-5 border-b pb-2">III. Biodata & Berkas Perorangan</h2>
                        
                        <div class="flex flex-col items-center justify-center mb-6 pb-5 border-b border-slate-100">
                            <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-2 text-center">Pas Foto 2x3 Resmi (JPG/JPEG)</label>
                            <div class="relative w-32 h-40 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center overflow-hidden bg-slate-50 hover:border-[#714B67] transition shadow-inner">
                                <template x-if="!photoPreview">
                                    <div class="text-center p-3 select-none pointer-events-none">
                                        <span class="block text-xl mb-1">📸</span>
                                        <span class="text-[10px] text-slate-400 block font-medium">Ketuk untuk Upload</span>
                                    </div>
                                </template>
                                <template x-if="photoPreview">
                                    <img :src="photoPreview" class="w-full h-full object-cover">
                                </template>
                                <input type="file" @change="uploadPhoto($event)" accept=".jpg,.jpeg" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                            <button x-show="photoPreview" @click="photoPreview = null; formData.pasFotoData = null;" type="button" class="text-xs text-red-500 font-semibold mt-2 hover:underline">Hapus Foto</button>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Nama Lengkap</label>
                                <input type="text" x-model="formData.nama" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" placeholder="Sesuai ijazah tanpa gelar" required>
                            </div>
                            
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">No. KTP (NIK)</label>
                                <input type="text" x-model="formData.ktp" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" placeholder="16 Digit NIK" inputmode="numeric" maxlength="16" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Agama</label>
                                <select x-model="formData.agama" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                    <option value="" disabled selected hidden>-- Pilih Agama --</option>
                                    <option value="Islam">Islam</option>
                                    <option value="Kristen">Kristen</option>
                                    <option value="Protestan">Protestan</option>
                                    <option value="Katolik">Katolik</option>
                                    <option value="Hindu">Hindu</option>
                                    <option value="Budha">Budha</option>
                                    <option value="Konghucu">Konghucu</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Jenis Kelamin</label>
                                <select x-model="formData.jenisKelamin" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                                    <option value="" disabled selected hidden>-- Pilih Jenis Kelamin --</option>
                                    <option value="Laki-Laki">Laki-Laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">No. WhatsApp</label>
                                <input 
                                    type="text" 
                                    x-model="formData.hp" 
                                    @blur="validatePhoneNumber" 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" 
                                    :class="formData.hp && !/^(0|\\+62)8/.test(formData.hp) ? 'border-red-500 bg-red-50' : ''"
                                    placeholder="Contoh: 08123456789 atau +628123456789" 
                                    required>
                                
                                <template x-if="formData.hp && !/^(0|\\+62)8/.test(formData.hp)">
                                    <span class="text-[11px] text-red-600 font-medium mt-1 block">
                                        ⚠️ Format salah! Nomor harus diawali dengan angka 0 atau +62 (Contoh: 0812...)
                                    </span>
                                </template>
                                
                                <span x-show="!formData.hp || /^(0|\\+62)8/.test(formData.hp)" class="text-[10px] text-slate-400 mt-1 block">
                                    Wajib diawali angka 0 atau +62 (Minimal 10 digit)
                                </span>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Tempat Lahir</label>
                                <input type="text" x-model="formData.tempatLahir" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" placeholder="Kota Tempat Lahir" required>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Tanggal Lahir</label>
                                <input type="date" x-model="formData.tanggalLahir" @change="validateAge" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" required>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Alamat Rumah Lengkap</label>
                                <textarea x-model="formData.alamat" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition leading-relaxed" placeholder="Nama Jalan, RT/RW, No. Rumah, Dusun" required></textarea>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Kelurahan & Kecamatan</label>
                                <input type="text" x-model="formData.kelurahanKecamatan" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#714B67] focus:bg-white transition" placeholder="Contoh: Kel. Menteng, Kec. Jeneberang" required>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Dokumen Pendukung (PDF)</label>
                                <input type="file" multiple @change="uploadPdf($event)" accept="application/pdf" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs focus:outline-none">
                                <div class="mt-2 p-3 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl">
                                    <p class="text-[11px] text-amber-900 leading-relaxed">
                                        <strong>Persyaratan Berkas:</strong><br>
                                        Silakan unggah dokumen wajib seperti <b>STR, Ijazah, atau Sertifikat</b> ke dalam format PDF.<br>
                                        <span class="text-red-600 font-bold">* Batas maksimal total ukuran berkas: 2MB.</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#714B67] hover:bg-[#5a3b52] text-white py-3.5 px-6 rounded-xl font-bold text-base shadow-md hover:shadow-lg transition disabled:bg-slate-400 disabled:cursor-not-allowed mb-6" :disabled="loading">
                        <span x-show="!loading">SUBMIT DATA PENDAFTARAN</span>
                        <span x-show="loading" x-text="progressText || 'SEDANG MENGIRIM DATA...'"></span>
                    </button>
                </form>
            </div>
        </template>
    </div>

    <!-- Loading Modal/Backdrop -->
    <div x-show="loading" x-cloak class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/60 text-white backdrop-blur-sm px-4 text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-white mb-4"></div>
        <p x-text="progressText" class="text-base font-semibold animate-pulse"></p>
        <p class="text-[11px] mt-1 opacity-75">Mohon tunggu, sistem sedang memproses file Anda ke cloud server.</p>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/options.js"></script>
    <script src="../js/searchableSelect.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/upload.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/form-reset.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
